<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>혜진 ♥ 정우 컨텐츠 보드</title>

    <!--
      홈 화면에 추가하면 앱처럼 열리고, 안드로이드에서는 인스타 공유 시트에도 뜬다
      (manifest의 share_target). %BASE_URL%은 Vite가 빌드할 때 실제 경로로 바꿔준다.
    -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#fb7185" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <!-- 아이폰은 manifest를 거의 안 보므로 홈 화면 표시용 설정을 따로 준다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="혜진♥정우" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
